name: Runner image

on:
  pull_request:
    paths:
      - .dockerignore
      - .github/workflows/image.yml
      - Dockerfile
      - renovate.json
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/image.yml
      - Dockerfile
      - renovate.json
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runner-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/appstuio/runner
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.event_name == 'pull_request'
        name: Smoke test
        run: |
          image="$(printf '%s\n' '${{ steps.metadata.outputs.tags }}' | head -n 1)"
          docker run --rm "$image" bash -lc '
            node_22_version="${NODE_22_RELEASE%%-*}"
            node_24_version="${NODE_24_RELEASE%%-*}"
            test "$(bun --version)" = "$(basename "$BUN_INSTALL")"
            test "$("$BUN_COMPAT_INSTALL/bin/bun" --version)" = "$(basename "$BUN_COMPAT_INSTALL")"
            test "$(node --version)" = "v${node_24_version}"
            test -x "$RUNNER_TOOL_CACHE/node/${node_22_version}/x64/bin/node"
            test -x "$RUNNER_TOOL_CACHE/node/${node_24_version}/x64/bin/node"
          '
