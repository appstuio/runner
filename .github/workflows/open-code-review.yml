name: OpenCodeReview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure OCR npm binaries
        run: echo "${{ runner.temp }}/ocr-npm-global/bin" >> "$GITHUB_PATH"

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@b3badd376fcf52f05a10aaf0a334c677dc8e0ddc # v1.11.3
        env:
          NPM_CONFIG_ALLOW_SCRIPTS: "@alibaba-group/open-code-review"
          # Use a deterministic prefix so the CLI remains on PATH across composite steps.
          NPM_CONFIG_PREFIX: ${{ runner.temp }}/ocr-npm-global
        with:
          llm_url: ${{ vars.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_use_anthropic: 'false'
          ocr_version: '1.11.3'
          checkpoint_range: 'true'
