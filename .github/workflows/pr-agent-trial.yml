name: PR-Agent Trial

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'pull_request_target' && github.event.pull_request.number == 13) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.number == 13))
    uses: appstuio/workflows/.github/workflows/pr-agent.yml@main
    secrets:
      OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
