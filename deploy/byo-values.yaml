githubConfigUrl: https://github.com/appstuio
githubConfigSecret: arc-github-config
runnerScaleSetName: byo
minRunners: 1
maxRunners: 8

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/appstuio/runner:latest@sha256:c192be6f123cd477a54ce70358035eb6ae60805b8df016937b5fa53da2d2df8b
        imagePullPolicy: IfNotPresent
        command:
          - /home/runner/run.sh
        resources:
          limits:
            cpu: "1"
            memory: 1536Mi
          requests:
            cpu: 750m
            memory: 1536Mi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
    volumes:
      - name: work
        emptyDir: {}
