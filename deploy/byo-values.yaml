githubConfigUrl: https://github.com/appstuio
githubConfigSecret: arc-github-config
runnerScaleSetName: byo
minRunners: 1
maxRunners: 8

template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/appstuio/runner:latest@sha256:c7b2ccab1baf374405935a5d87bfa6f34e57e6e09130be7c5a43c7a5f920fca3
        imagePullPolicy: IfNotPresent
        command:
          - /home/runner/run.sh
        resources:
          limits:
            cpu: "1"
            memory: 1536Mi
          requests:
            cpu: 750m
            memory: 1536Mi
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
    volumes:
      - name: work
        emptyDir: {}
